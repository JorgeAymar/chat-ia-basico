# Config de nginx para orion.labshub.cc, pensada para vivir en
# /etc/nginx/sites-available/ del VPS (fuera de Docker — ver DEPLOY.md).
# Sigue el mismo patrón que los demás sitios *.labshub.cc de este servidor
# compartido (webroot /var/www/html para el challenge ACME, snippets e
# includes de TLS comunes, headers de seguridad, CF-Connecting-IP porque
# el tráfico llega proxeado por Cloudflare).
#
# El upstream apunta a un archivo aparte (orion-active-upstream.conf) en vez
# de tener el puerto fijo acá adentro: eso es lo que le permite a deploy.sh
# cambiar de contenedor activo (blue↔green) con un simple `nginx -s reload`
# — sin cortar ni una conexión.
#
# El detalle que importa acá y en ningún otro proxy reverso genérico: el chat
# hace streaming NDJSON de a chunks chicos por varios segundos o minutos
# (POST /api/chat). Si nginx bufferea la respuesta como con cualquier otra
# API, el usuario ve la respuesta completa de golpe al final en vez de ir
# apareciendo — exactamente lo que `proxy_buffering off` más abajo evita.

upstream orion_app {
    include /etc/nginx/orion-active-upstream.conf;
}

# App mobile (PWA), un proyecto Next.js aparte (ver mobile/ en el repo) sin
# base de datos propia: next.config.ts de ahí reescribe /api/* hacia este
# mismo dominio (orion_app), así que /m/api/chat vuelve a entrar por el
# location /api/chat de abajo en un segundo salto — el streaming sigue
# funcionando sin configurar nada especial acá para esa ruta.
upstream orion_mobile {
    include /etc/nginx/orion-mobile-active-upstream.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orion.labshub.cc;

    # certbot completa estas dos rutas la primera vez que se corre
    # (`certbot --nginx -d orion.labshub.cc`) — quedan acá como placeholder
    # documentando dónde van.
    ssl_certificate     /etc/letsencrypt/live/orion.labshub.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orion.labshub.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/deny-dotfiles.conf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Los adjuntos (imágenes en base64, PDFs) pueden acercarse a esto entre
    # los 5 archivos que la app permite por mensaje; el default de nginx
    # (1m) los cortaría con 413 antes de que lleguen a la app.
    client_max_body_size 50m;

    location / {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://orion_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    }

    # Sin este bloque aparte, el streaming del chat se ve entero de golpe al
    # final en vez de ir token por token.
    location /api/chat {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://orion_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Una respuesta puede tardar varios minutos con un modelo lento o
        # una búsqueda web incluida; el default de nginx (60s) la cortaría
        # a mitad de generación.
        proxy_read_timeout 300s;
    }

    # Landing pública (orion-chat-landing/ en el repo): HTML/CSS/JS estático,
    # sin pasar por Next. deploy.sh la copia a /var/www/orion-landing/ en
    # cada deploy — no se sirve directo del checkout porque vive bajo /root
    # (700), que los workers de nginx (www-data) no pueden atravesar.
    # proxy.ts redirige acá a quien entra a "/" sin sesión.
    location = /presentacion {
        return 301 /presentacion/;
    }
    location /presentacion/ {
        alias /var/www/orion-landing/;
        index index.html;
    }

    # Sin slash final a propósito: la app mobile corre con basePath="/m"
    # (ver mobile/next.config.ts) y espera recibir el prefijo /m intacto en
    # cada request — un `location /m/` con `proxy_pass http://orion_mobile/`
    # (con slash) se lo recortaría antes de reenviar.
    location /m {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://orion_mobile;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name orion.labshub.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
