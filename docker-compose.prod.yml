# Stack de producción. Este archivo se usa para el SETUP INICIAL del VPS
# (`docker compose up -d postgres searxng`, una vez) — deploy.sh, en cada
# despliegue de código, NO vuelve a invocar Compose contra este archivo.
#
# Por qué: el servicio `migrate` de acá abajo tiene `depends_on: postgres`,
# así que cualquier `docker compose run/up` en este proyecto arrastra a
# postgres al grafo de dependencias. Si el config-hash que Compose guardó
# en el contenedor no matchea exacto con lo que resuelve ahora (pasa fácil:
# un campo tocado acá, un postgres creado alguna vez fuera de Compose), lo
# marca para recrear — y recrear la base de datos en cada deploy de código
# es justo la caída que "zero downtime" promete evitar. deploy.sh en cambio
# construye la imagen de `migrate` y la corre con `docker run` directo
# (ver ahí), sin pasar nunca por el grafo de dependencias de Compose.
#
# Otras dos piezas quedan AFUERA de este archivo a propósito:
#
# - nginx corre en el host del VPS, no en un contenedor: manejar
#   certificados Let's Encrypt con certbot es mucho más simple cuando nginx
#   tiene acceso directo al puerto 80/443 del host. Ver nginx/orion.conf.
#
# - El servicio `app` NO está acá: lo maneja deploy.sh con `docker run`
#   directo, no `docker compose up`. Es lo que permite tener dos
#   contenedores de la app corriendo a la vez con nombres/puertos distintos
#   (blue/green) durante un despliegue sin caída — Compose no modela bien
#   "dos instancias nombradas del mismo servicio" para ese swap puntual.
#   deploy.sh los conecta a la red que este archivo crea (`orion_default`,
#   por el nombre de proyecto `-p orion` con el que se levanta este stack).
#
# postgres y searxng NO publican puertos al host: solo la app los necesita,
# y solo por la red interna de Docker (nombre de servicio como host). Menos
# superficie expuesta que en docker-compose.yml (desarrollo), que sí publica
# esos puertos para poder pegarles con `psql`/curl desde la máquina.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatuser}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}"
      POSTGRES_DB: ${POSTGRES_DB:-chat_ia_basico}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatuser}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    memswap_limit: 512m

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?falta SEARXNG_SECRET en .env}"
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    mem_limit: 512m
    memswap_limit: 512m

  # Job de una sola corrida: aplica las migraciones pendientes y termina.
  # Queda acá como definición de referencia/para uso manual — deploy.sh NO
  # lo corre vía Compose (ver el comentario grande arriba del archivo),
  # construye esta misma imagen con `docker build --target migrator` y la
  # corre con `docker run` directo.
  migrate:
    build:
      context: ./orion-chat-web
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chat_ia_basico}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # external: true — esta red la crea deploy.sh UNA sola vez (ver el guard
  # con `docker network create` antes del primer `compose up`), no Compose
  # en cada corrida. Sin esto, Compose compara su config resuelta contra el
  # hash que guardó en la red al crearla y, ante cualquier diferencia (un
  # campo cambiado en este archivo, un drift viejo, lo que sea), intenta
  # BORRAR Y RECREAR la red — y aborta con "active endpoints" porque
  # postgres/searxng/orion-app-* siguen enganchados. En un VPS compartido
  # con contenedores de larga vida eso no es negociable: la red se crea una
  # vez con la subred correcta y después no se vuelve a tocar.
  default:
    name: orion_default
    external: true

volumes:
  postgres-data:
  searxng-cache:
